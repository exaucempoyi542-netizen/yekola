name: mobile_app
description: "Educ — Plateforme éducative Yekola"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.9.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  sqflite: 2.4.0
  path: ^1.9.1
  sqflite_common_ffi_web: ^0.4.4
  video_player: ^2.10.1
  chewie: ^1.13.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  app_links: ^6.3.2
  webview_flutter: ^4.13.1
  flutter_widget_from_html: ^0.17.2
  file_picker: ^8.1.2

  # Firebase — Auth, Chat, Notifications
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  flutter_webrtc: ^0.12.3
  google_fonts: ^6.2.1
  flutter_pdfview: ^1.4.5

dependency_overrides:
  sqflite_android: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/images/app_icon.png
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  adaptive_icon_background: "#0B3D2E"
