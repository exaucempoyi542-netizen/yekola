org.gradle.internal.classpath.instrumentation.enabled=false
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dcom.sun.crypto.provider.AESGCM.NoNative=true -Dhttp.keepAlive=false -Djdk.tls.client.protocols=TLSv1.2
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.max.tentatives=10
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
android.enableJetifier=true

# Performance
org.gradle.parallel=false
org.gradle.caching=false
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
# Workaround for Tag mismatch on Windows (force HTTP/1.1)
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000

# Désactiver les tâches lint des sous-projets (évite les téléchargements réseau inutiles)
android.lint.abortOnError=false
android.lint.checkReleaseBuilds=false
kotlin.incremental=false

# Network Reliability Fixes
systemProp.http.keepAlive=false
systemProp.https.protocols=TLSv1.2
systemProp.http.proxyHost=
systemProp.http.proxyPort=
org.gradle.network.retry.max-attempts=10
org.gradle.network.retry.initial-backoff=3000

# Disable caching temporarily to force fresh downloads
org.gradle.caching=false

# Move Kotlin daemon run files to E: drive to avoid C: drive saturation
kotlin.daemon.run.files.path=E:\\.kotlin\\daemon
