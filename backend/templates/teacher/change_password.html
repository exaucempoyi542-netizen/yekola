{% extends 'teacher/base.html' %}
{% load static %}

{% block page_title %}Mot de passe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="able-card">
            <div class="able-card-head">
                <h2>Changer le mot de passe</h2>
                <span class="able-badge muted">{{ request.user.username }}</span>
            </div>
            <div class="able-card-body">
                {% if error %}
                <div class="alert alert-danger border-0 mb-3">{{ error }}</div>
                {% endif %}
                <form method="POST" autocomplete="off">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="able-label" for="current_password">Mot de passe actuel</label>
                        <input type="password" name="current_password" id="current_password"
                               class="able-input" required autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label class="able-label" for="new_password">Nouveau mot de passe</label>
                        <input type="password" name="new_password" id="new_password"
                               class="able-input" required minlength="8" autocomplete="new-password">
                        <div class="small mt-1" style="color:var(--able-muted);">Minimum 8 caractères</div>
                    </div>
                    <div class="mb-4">
                        <label class="able-label" for="confirm_password">Confirmer le nouveau mot de passe</label>
                        <input type="password" name="confirm_password" id="confirm_password"
                               class="able-input" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="d-flex flex-wrap gap-2 justify-content-end">
                        <a href="{% if request.user.role == 'MANAGER' %}{% url 'manager_dashboard' %}{% elif request.user.role == 'DEAN' %}{% url 'dean_dashboard' %}{% else %}{% url 'teacher_dashboard' %}{% endif %}"
                           class="able-btn able-btn-outline">Annuler</a>
                        <button type="submit" class="able-btn able-btn-primary">
                            <i class="fa-solid fa-key"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
