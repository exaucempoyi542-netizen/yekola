{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion admin · Yekola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0A1628;
            --ink-soft: #152A45;
            --ink-mid: #1E3A5F;
            --fog: #F3F6FA;
            --muted: #5B6B7F;
            --text: #152033;
            --border: #D0D7E2;
            --white: #FFFFFF;
            --danger: #B91C1C;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            background: var(--fog);
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
        }

        .visual {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background: linear-gradient(145deg, var(--ink), var(--ink-soft));
            color: var(--white);
        }

        .visual img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .visual::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(10, 22, 40, 0.4) 0%, rgba(10, 22, 40, 0.8) 70%, rgba(10, 22, 40, 0.94) 100%);
            z-index: 1;
        }

        .visual-copy {
            position: absolute;
            z-index: 2;
            left: clamp(1.5rem, 4vw, 3rem);
            right: clamp(1.5rem, 4vw, 3rem);
            bottom: clamp(2rem, 6vh, 3.5rem);
            max-width: 28rem;
            animation: rise 0.8s var(--ease) both;
        }

        .visual-copy .brand {
            font-family: 'Fraunces', serif;
            font-size: clamp(2.4rem, 4vw, 3.4rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 0.75rem;
        }

        .visual-copy p {
            color: rgba(232, 239, 248, 0.86);
            font-size: 1.05rem;
            line-height: 1.5;
            max-width: 36ch;
        }

        .panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1.5rem, 4vw, 3rem);
            background:
                radial-gradient(ellipse 70% 50% at 100% 0%, rgba(30, 58, 95, 0.08), transparent),
                var(--fog);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: clamp(1.75rem, 3vw, 2.25rem);
            box-shadow: 0 18px 40px rgba(10, 22, 40, 0.08);
            animation: rise 0.8s var(--ease) 0.08s both;
        }

        .login-header {
            margin-bottom: 1.6rem;
            text-align: center;
        }

        .login-logo {
            display: block;
            width: 72px;
            height: 72px;
            margin: 0 auto 1rem;
            object-fit: contain;
        }

        .login-header h1 {
            font-family: 'Fraunces', serif;
            font-size: 1.55rem;
            font-weight: 650;
            letter-spacing: -0.03em;
            color: var(--ink);
            margin-bottom: 0.35rem;
        }

        .login-header p {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.45;
        }

        .alert-error {
            background: #FEE2E2;
            border: 1px solid #FECACA;
            color: var(--danger);
            padding: 0.75rem 0.9rem;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 0.95rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--white);
            color: var(--text);
            transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--ink-soft);
            box-shadow: 0 0 0 3px rgba(21, 42, 69, 0.16);
        }

        .form-group input::placeholder {
            color: #A3ADBE;
        }

        .btn-login {
            width: 100%;
            margin-top: 0.35rem;
            padding: 0.9rem;
            border: none;
            border-radius: 999px;
            background: var(--ink-soft);
            color: var(--white);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s var(--ease), transform 0.2s var(--ease);
        }

        .btn-login:hover {
            background: var(--ink-mid);
            transform: translateY(-1px);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            body {
                grid-template-columns: 1fr;
            }

            .visual {
                min-height: 34vh;
                min-height: 34dvh;
            }

            .visual-copy {
                bottom: 1.25rem;
                left: 1.25rem;
                right: 1.25rem;
            }

            .visual-copy .brand {
                font-size: 2rem;
            }

            .visual-copy p {
                font-size: 0.95rem;
                max-width: none;
            }

            .panel {
                padding: 1.25rem;
                align-items: flex-start;
            }

            .login-box {
                margin-top: -1.5rem;
                position: relative;
                z-index: 2;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                border-radius: 14px;
                padding: 1.4rem 1.2rem;
            }

            .login-logo {
                width: 64px;
                height: 64px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <aside class="visual" aria-hidden="true">
        <img src="{% static 'teacher/img/landing_admin_hero.png' %}?v=3"
             alt=""
             width="1600" height="900"
             decoding="async">
        <div class="visual-copy">
            <div class="brand">Yekola</div>
            <p>Portail d’administration nationale et provinciale du système de formation.</p>
        </div>
    </aside>

    <main class="panel">
        <div class="login-box">
            <div class="login-header">
                <img class="login-logo"
                     src="{% static 'teacher/img/educ_logo.png' %}?v=1"
                     alt="Yekola"
                     width="72" height="72">
                <h1>Connexion admin</h1>
                <p>Espace administration nationale et provinciale</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                {% if error %}
                <div class="alert-error">{{ error }}</div>
                {% endif %}

                <div class="form-group">
                    <label for="username">Identifiant</label>
                    <input id="username" type="text" name="username" placeholder="Nom d'utilisateur" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input id="password" type="password" name="password" placeholder="Mot de passe" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login">Se connecter</button>
            </form>
        </div>
    </main>
</body>

</html>
