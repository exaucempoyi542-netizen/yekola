<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Diagramme de classes</title>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    const params = new URLSearchParams(location.search);
    const src = params.get("src") || "diagramme_classes_vue_ensemble.mmd";
    mermaid.initialize({
      startOnLoad: false,
      theme: "default",
      securityLevel: "loose",
      class: { hideEmptyMembersBox: true },
    });
    try {
      const text = await fetch(src).then((r) => {
        if (!r.ok) throw new Error("fetch " + src + " -> " + r.status);
        return r.text();
      });
      const el = document.getElementById("diagram");
      el.textContent = text;
      const { svg } = await mermaid.render("mmd-" + Date.now(), text);
      el.innerHTML = svg;
      document.body.dataset.ready = "1";
      document.title = "READY";
    } catch (e) {
      document.body.dataset.error = String(e && e.message ? e.message : e);
      document.body.dataset.ready = "0";
      document.title = "ERROR";
      document.getElementById("diagram").textContent = String(e);
      console.error(e);
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 24px;
      background: #fff;
      display: inline-block;
      min-width: 100%;
    }
    #diagram svg {
      max-width: none !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <div id="diagram" class="mermaid"></div>
</body>
</html>
